name: verify

on:
  push:
    branches: [main, "diamond-standard/**", "science/**"]
  pull_request:

jobs:
  claim-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: compile python scripts
        run: python3 -m py_compile 02_galaxy_dynamics/*.py 03_observer_jwst/*.py scripts/*.py
      - name: claim consistency
        run: python3 scripts/check_claim_consistency.py
      - name: cryptographic witness attestation
        env:
          CHRYPTOS: ${{ secrets.CHRYPTOS }}
        run: |
          python3 scripts/cryptographic_witness.py --out RELEASE_WITNESS.json
          python3 scripts/cryptographic_witness.py --verify RELEASE_WITNESS.json
