name: verify

on:
  push:
    branches: [main, "diamond-standard/**"]
  pull_request:
  schedule:
    # Daily, off-peak. Exists to bound the O6 stall rate over time (see the
    # lean-gate job below), not to gate ordinary development.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same PR supersedes the older run.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  claim-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: current_state_freshness.py runs a path-limited `git log`.
          # On a depth-1 clone that returns HEAD's date for EVERY path, so the gate
          # reported "physics changed today" on every push (2026-10-08).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: install pinned dependencies
        run: pip install -r requirements.txt
      # CI runs exactly what contributors run. Before 2026-09-30 this job
      # re-listed a subset of scripts/local_gate.sh by hand and had silently
      # dropped the dead-branch scan, grounding audit, tier legend,
      # current-state freshness, frontmatter and publication checks -- the
      # gates that exist to stop retired physics reaching a live surface.
      - name: local gate (full)
        run: bash scripts/local_gate.sh
      - name: compile remaining python scripts
        run: python3 -m py_compile scripts/validate_claim_registry.py scripts/test_claim_registry_fixtures.py scripts/generate_assurance_report.py scripts/validate_sparc_reproduction.py
      - name: install mvpc-x judge
        run: pip install "git+https://github.com/Mega-Therion/MVPC-X.git@09876e858e092868ab413a59123ea6216f092031"
      - name: run mvpc-x claim judge
        run: |
          python3 scripts/render_mvpc_fixtures.py --out /tmp/res_nova_bundle.json
          python3 -m mvpc.claim_consumer --bundle /tmp/res_nova_bundle.json

  # Lean kernel verification. O6 (reproducing green from a machine with no
  # pre-existing Mathlib, via a fresh `lake exe cache get`) was narrowed by two
  # manual walks -- VERIFICATION_RUN_007 (local pre-warmed cache) and
  # VERIFICATION_RUN_008 (genuine origin fetch, 32/32 targets, exit 0) -- but
  # a concurrent attempt on a different machine hit a stall on the same
  # prebuilt-cache endpoint around the same time RUN_008 succeeded. So this
  # runs on push/schedule/dispatch, not on every pull_request: an unrelated
  # contributor's PR should not go red because Azure blob storage had a bad
  # minute. The schedule exists specifically to keep collecting that stall-rate
  # data automatically instead of via more one-off manual walks.
  lean-gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean toolchain and fetch Mathlib cache (no local build/test/lint)
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: 05_lean_formalization
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Run the full proof verification gate
        run: cd 05_lean_formalization && bash verify_all_proofs.sh

