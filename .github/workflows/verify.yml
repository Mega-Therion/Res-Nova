name: verify

on:
  push:
    branches: [main, "diamond-standard/**"]
  pull_request:

jobs:
  claim-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: compile SPARC scripts
        run: python3 -m py_compile 02_galaxy_dynamics/*.py scripts/check_claim_consistency.py
      - name: claim consistency
        run: python3 scripts/check_claim_consistency.py

  # Lean is a release gate, not a PR smoke test. Mathlib is multi-GB and the
  # recorded PASS was local (open O6). Do not pretend this job exists until
  # someone walks `lake exe cache get` on a blank runner.
