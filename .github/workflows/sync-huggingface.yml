name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "huggingface_hub>=0.24,<2"

      # Fail closed: never publish a dataset card that asserts a result the
      # corpus refutes, or advertises a directory that is not uploaded.
      - name: Check dataset card
        run: python3 scripts/test_hf_card.py

      - name: Sync Dataset Repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/sync_huggingface.py
