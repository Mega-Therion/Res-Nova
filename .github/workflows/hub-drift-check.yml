name: Hub drift check

# Warns when the research hub's pinned Res-Nova commit falls behind main.
# The hub moved into research-hub/ on 2026-10-03; before that, this job sent a
# repository_dispatch to the separate hub repository (now archived).
on:
  push:
    branches: [main]
    paths:
      - "assurance/claims.json"
      - "CLAIM_EVIDENCE_LEDGER.md"
      - "RELEASE_CHECKLIST.md"
      - "research-hub/client/src/data/research.ts"
      - "scripts/check_hub_drift.py"
      - ".github/workflows/hub-drift-check.yml"

permissions:
  contents: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check hub drift
        env:
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/check_hub_drift.py
