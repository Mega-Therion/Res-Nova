<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Res-Nova Evidence Atlas lifecycle</title><desc id="desc">Editable flow diagram connecting source material, a bounded claim, evidence and assumptions, falsifiability tests, and a transparent status report.</desc><rect width="1600" height="900" fill="#07111f"/><g font-family="ui-sans-serif,system-ui,sans-serif"><text x="100" y="100" fill="#e7f0fa" font-size="38" font-weight="700">RES-NOVA • EVIDENCE ATLAS</text><text x="100" y="140" fill="#91a9c2" font-size="20">A claim registry records what is derived, supported, conditional, proposed, open, or refuted.</text></g><g fill="none" stroke="#f2c14e" stroke-width="5"><path d="M375 405H470"/><path d="M730 405H825"/><path d="M1085 405H1180"/></g><g fill="#f2c14e"><polygon points="470,405 440,387 440,423"/><polygon points="825,405 795,387 795,423"/><polygon points="1180,405 1150,387 1150,423"/></g><g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle"><rect x="110" y="270" width="265" height="270" rx="24" fill="#0b2130" stroke="#42c9d7" stroke-width="3"/><text x="243" y="350" fill="#eef7ff" font-size="25" font-weight="700">SOURCE</text><text x="243" y="392" fill="#a9c6d5" font-size="18">manuscript</text><text x="243" y="422" fill="#a9c6d5" font-size="18">audit</text><text x="243" y="452" fill="#a9c6d5" font-size="18">reproduction run</text><rect x="470" y="270" width="260" height="270" rx="24" fill="#302417" stroke="#f2b84b" stroke-width="3"/><text x="600" y="350" fill="#fff4d1" font-size="25" font-weight="700">CLAIM</text><text x="600" y="392" fill="#ffd68c" font-size="18">bounded text</text><text x="600" y="422" fill="#ffd68c" font-size="18">exact locator</text><text x="600" y="452" fill="#ffd68c" font-size="18">commit provenance</text><rect x="825" y="270" width="260" height="270" rx="24" fill="#211c3e" stroke="#b77bff" stroke-width="3"/><text x="955" y="350" fill="#eef7ff" font-size="25" font-weight="700">EVIDENCE</text><text x="955" y="392" fill="#d8baff" font-size="18">assumptions</text><text x="955" y="422" fill="#d8baff" font-size="18">derivation / test</text><text x="955" y="452" fill="#d8baff" font-size="18">result and scope</text><rect x="1180" y="270" width="300" height="270" rx="24" fill="#173226" stroke="#60d394" stroke-width="3"/><text x="1330" y="350" fill="#eef7ff" font-size="25" font-weight="700">STATUS REPORT</text><text x="1330" y="392" fill="#a8e9c2" font-size="18">derived / supported</text><text x="1330" y="422" fill="#a8e9c2" font-size="18">conditional / open</text><text x="1330" y="452" fill="#a8e9c2" font-size="18">proposal / refuted</text></g><rect x="190" y="680" width="1220" height="82" rx="18" fill="#102030" stroke="#29435e" stroke-width="2"/><text x="800" y="732" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" fill="#d4e3f2" font-size="22">The registry increases auditability; it does not strengthen a claim beyond its recorded evidence and test scope.</text></svg>