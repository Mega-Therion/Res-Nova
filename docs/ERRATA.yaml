# Res-Nova errata register: one machine-readable entry per withdrawn result.
#
# Gate: scripts/check_errata.py (run by scripts/local_gate.sh). It fails when
#   - a retired entity in scripts/dead_branch_scan.py RETIRED has no entry here,
#   - a correction record has no entry here: a docs/publication_registry.yaml
#     work whose title contains "correction", or a new version listed in a
#     ZENODO_CORRECTION_INDEX_*.md table,
#   - an evidence path does not exist in the repository.
# Adding a retired entity or publishing a correction therefore requires an entry.
#
# Fields: id; withdrawn (date, YYYY-MM-DD); what (the withdrawn statement);
# replacement (what to use instead); evidence (repo paths that record it);
# scan_entities (dead_branch_scan labels); dois (Zenodo correction records).
