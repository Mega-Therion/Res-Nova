# Grounding ledger.
#
# One entry per formal module. The three judgement fields cannot be
# computed and must be written by a person:
#
#   denotes    -- what the module's symbols are claimed to denote
#                 physically. "none" is a legitimate answer: it means
#                 the module is mathematics, not a physical claim.
#   observable -- the measurable quantity or dataset it touches,
#                 or "none".
#   falsifier  -- the measurement that would kill the claim,
#                 or "none".
#
# tier is computed, not written: STRUCT means the module quantifies
# over a mathematical structure; ARITH means it quantifies over ℝ.
# An ARITH module may not be cited in a manuscript as physical
# evidence, however green the kernel is.

modules:
  - module: BinaryTetrahedral
    tier: ARITH
    theorems: 18
    structures: 0
    plain_real_defs: 0
    denotes: "the AeST tracking-slope parameter lambda_s and the residual acceleration delta_g = (1+lambda_s)^3 a_0^2 r^2 / (2 G_N M) it leaves beyond Newton in the solar system"
    observable: "Cassini quadrupole ceiling Q_2 < 3.4e-27 s^-2 (Park et al. 2026, PRD, doi 10.1103/r7n8-kw38) and planetary perihelion residuals (Park et al. 2017 AJ 153:121; Konopliv et al. 2011 Icarus 211:401; Pitjev & Pitjeva 2013 MNRAS 432:3431; Hees et al. 2014 PRD 89:102002)"
    falsifier: "a solar-system residual with r^2 radial profile detected above the quoted ceilings, or its absence at a level excluding lambda_s = O(1)"

