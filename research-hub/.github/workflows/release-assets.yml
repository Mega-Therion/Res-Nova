name: Validate and regenerate public research assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download cited SPARC archive
        run: |
          mkdir -p .release-input
          curl --fail --location --retry 3 --output .release-input/Rotmod_LTG.zip \
            "https://zenodo.org/records/16284118/files/Rotmod_LTG.zip?download=1"

      - name: Regenerate public catalog and chart export
        run: python scripts/generate_public_assets.py --archive .release-input/Rotmod_LTG.zip

      - name: Validate release assets and claim registry linkage
        run: node scripts/check_release_assets.mjs

      - name: Install frontend dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Run TypeScript and production build gates
        run: pnpm check && pnpm build

      - name: Confirm generated assets are committed
        run: git diff --exit-code -- client/src/data/sparc.ts client/public/downloads/sparc-rotation-curves-slice.csv client/public/downloads/sparc-rotation-curves-slice.svg
